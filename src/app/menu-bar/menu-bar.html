<nav class="menu-bar" aria-label="Menu bar">
  <div class="menu-bar-left">
    @for (menu of menus(); track menu.id) {
      <div class="menu-container">
        <button
          type="button"
          class="menu-bar-item"
          [class.apple-logo]="menu.isApple"
          [class.app-name]="menu.id === 'app'"
          [class.open]="openMenuId() === menu.id"
          [attr.data-menu-id]="menu.id"
          aria-haspopup="menu"
          [attr.aria-expanded]="openMenuId() === menu.id"
          [attr.aria-label]="menu.isApple ? 'Apple menu' : null"
          (click)="toggleMenu(menu.id)"
          (mouseenter)="onMenuHover(menu.id)"
          (keydown)="onTriggerKeydown($event, menu.id)"
        >
          @if (menu.isApple) {
            <svg width="14" height="17" viewBox="0 0 14 17" fill="currentColor" aria-hidden="true">
              <path
                d="M13.1 12.6c-.3.7-.6 1.3-1.1 1.9-.6.8-1.1 1.4-1.6 1.7-.6.4-1.3.6-2 .6-.5 0-1.1-.1-1.8-.4-.7-.3-1.3-.4-1.8-.4-.5 0-1.1.1-1.8.4-.6.3-1.2.4-1.6.4-.7 0-1.4-.2-2-.7-.5-.3-1-1-1.5-1.8C.7 12.9.3 11.4 0 10c-.2-1-.3-2-.3-3 0-1.1.2-2 .7-2.8.4-.6.9-1.2 1.5-1.5.6-.4 1.3-.6 2-.6.5 0 1.2.2 2 .5.8.3 1.3.5 1.5.5.2 0 .7-.2 1.7-.6.8-.3 1.5-.5 2.1-.4 1.5.1 2.7.7 3.4 1.8-1.4.8-2 2-2 3.5 0 1.2.4 2.2 1.3 3 .4.4.8.7 1.3.9l-.1.3zM10 .3c0 .9-.3 1.8-1 2.6-.8 1-1.8 1.5-2.9 1.4 0-.1 0-.2 0-.4 0-.9.4-1.8 1-2.5.3-.4.8-.7 1.3-.9.5-.2 1-.4 1.5-.4 0 .1 0 .2.1.2z"
              />
            </svg>
          } @else {
            {{ menu.label }}
          }
        </button>

        @if (openMenuId() === menu.id) {
          <div
            class="menu-dropdown"
            role="menu"
            tabindex="-1"
            [attr.aria-label]="menu.isApple ? 'Apple menu' : menu.label"
            (keydown)="onDropdownKeydown($event)"
          >
            @for (item of menu.items; track item.id) {
              @if (item.type === 'separator') {
                <div class="menu-dropdown-separator" role="separator"></div>
              } @else {
                <button
                  type="button"
                  class="menu-dropdown-item"
                  role="menuitem"
                  [disabled]="item.disabled"
                  (click)="onItemClick(item)"
                >
                  <span class="menu-dropdown-label">{{ item.label }}</span>
                  @if (item.shortcut) {
                    <span class="menu-dropdown-shortcut" aria-hidden="true">{{ item.shortcut }}</span>
                  }
                </button>
              }
            }
          </div>
        }
      </div>
    }
  </div>

  <div class="menu-bar-right">
    <button
      type="button"
      class="menu-bar-item spotlight-trigger"
      aria-label="Spotlight"
      (click)="spotlightRequested.emit()"
    >
      🔍
    </button>
    <span class="menu-bar-clock">{{ clock() }}</span>
  </div>
</nav>
